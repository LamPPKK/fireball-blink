[package]
name = "fireball-adblock"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ffi-test = []

[dependencies]
adblock = { version = "=0.13.2", default-features = false, features = ["full-regex-handling", "single-thread"] }
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["rand_core", "std"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
