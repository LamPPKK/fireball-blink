name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tooling-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustc --version
      - name: Install media integration dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Dpkg::Use-Pty=0 install --yes --no-install-recommends aria2 ffmpeg
          aria2c --version
          ffmpeg -version
          ffprobe -version
      - run: make check
