<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fireballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#B8FF3D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Pill -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0A090D" stroke="#282536" stroke-width="4" />
  
  <!-- Outer Ring Fireball Flame -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#fireballGrad)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Letter F Fireball Stylized -->
  <text x="64" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="url(#fireballGrad)" text-anchor="middle">F</text>
  
  <!-- Mini Orbit Satellite Dot -->
  <circle cx="94" cy="38" r="6" fill="#B8FF3D" filter="url(#glow)" />
</svg>
