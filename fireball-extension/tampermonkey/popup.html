<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fireball Tampermonkey</title>
  <style>
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D0E12; color: #F0F2F5; margin: 0; padding: 14px; box-sizing: border-box; }
    h3 { margin-top: 0; font-size: 14px; color: #00FF88; display: flex; justify-content: space-between; align-items: center; }
    .script-card { background: #1A1D26; border-radius: 8px; padding: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
    .script-info { flex: 1; }
    .script-title { font-weight: bold; font-size: 12px; margin-bottom: 2px; }
    .script-match { font-size: 10px; color: #8E95A5; font-family: monospace; }
    .btn-toggle { background: #00FF88; color: #000; border: none; font-weight: bold; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-add { width: 100%; background: #242834; color: #00FF88; border: 1px dashed #00FF88; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>🐒 Fireball Tampermonkey <span style="font-size:10px; color:#8E95A5">v1.0.0</span></h3>
  <div id="script-list">
    <div class="script-card">
      <div class="script-info">
        <div class="script-title">Universal Dark Reader</div>
        <div class="script-match">*://*/*</div>
      </div>
      <button class="btn-toggle">ON</button>
    </div>
  </div>
  <button class="btn-add">+ Install New UserScript (.user.js)</button>
</body>
</html>
